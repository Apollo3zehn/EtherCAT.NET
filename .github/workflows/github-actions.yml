name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

env:
  CONFIGURATION: Release
  FILE_BASE: libsoem_wrapper
  FILE_EXT_LINUX: .so
  ARTIFACTS: "artifacts"
  PACKAGES: "packages"
  DOWNLOAD: "download"
  BIN32: "bin32"
  BIN64: "bin64"
  SOEM_WRAPPER: "SOEM_wrapper"
  LINUX_X86: "linux-x86"
  LINUX_X64: "linux-x64"
  LINUX_ARM: "linux-arm"
  LINUX_ARM64: "linux-arm64"
  WIN_X86: "win-x86"
  WIN_X64: "win-x64"
  ARM32: "arm32"
  ARM64: "arm64"

jobs:

  detect-branch:

    runs-on: ubuntu-latest

    outputs:
      is_master_branch: ${{ steps.detect.outputs.is_master_branch }}

    steps:
      - name: Detect master branch
        id: detect
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "is_master_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_master_branch=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux-x64:

    runs-on: ubuntu-latest
    needs: detect-branch

    env:
      IS_MASTER_BRANCH: ${{ needs.detect-branch.outputs.is_master_branch }}

    defaults:
      run:
        shell: bash

    steps:

      - run: echo "Linux x64 build"

      - name: Checkout repository
        uses: actions/checkout@v5

      # 32-bit Toolchain for Linux x64
      - name: Install 32-bit toolchain (x86)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Run PowerShell init script
        shell: pwsh
        run: |
          dotnet --info
          ./init_solution.ps1

      - name: Native build 32
        run: make --directory "./${{ env.ARTIFACTS }}/${{ env.BIN32 }}"

      - name: Native build 64
        run: make --directory "./${{ env.ARTIFACTS }}/${{ env.BIN64 }}"

      # Upload native artifacts
      - name: Upload 32-bit artifact
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_X86 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.BIN32 }}/${{ env.SOEM_WRAPPER }}/${{ env.FILE_BASE }}${{ env.FILE_EXT_LINUX }}

      - name: Upload 64-bit artifact
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_X64 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.BIN64 }}/${{ env.SOEM_WRAPPER }}/${{ env.FILE_BASE }}${{ env.FILE_EXT_LINUX }}

      # Build .NET project
      - name: .NET build
        run: dotnet build ./src/EtherCAT.NET/EtherCAT.NET.csproj -c $Env:CONFIGURATION

  build-linux-arm:

    runs-on: ubuntu-24.04-arm
    needs: detect-branch

    env:
      IS_MASTER_BRANCH: ${{ needs.detect-branch.outputs.is_master_branch }}

    container:
      image: ubuntu:20.04

    defaults:
      run:
        shell: bash

    steps:

      - run: echo "Linux Arm build"

      - name: Print container OS info
        run: |
          . /etc/os-release
          echo "Linux ARM build on: $NAME $VERSION (ID=$ID, VERSION_ID=$VERSION_ID)"
          uname -a

      - name: Install PowerShell and 32-bit toolchain
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive

          # Native tools and prerequisites
          apt-get update
          apt-get install -y --no-install-recommends \
            wget \
            ca-certificates \
            tar \
            tzdata \
            git \
            build-essential \
            cmake \
            crossbuild-essential-armhf

          # Avoid interactive tzdata prompts
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime || true
          dpkg-reconfigure --frontend noninteractive tzdata || true

          # Install PowerShell from Linux arm64 tarball
          PS_VERSION=7.5.4
          wget "https://github.com/PowerShell/PowerShell/releases/download/v${PS_VERSION}/powershell-${PS_VERSION}-linux-arm64.tar.gz" \
            -O /tmp/powershell.tar.gz

          mkdir -p /opt/microsoft/powershell/${PS_VERSION}
          tar zxf /tmp/powershell.tar.gz -C /opt/microsoft/powershell/${PS_VERSION}

          # Ensure the pwsh binary is executable
          chmod +x /opt/microsoft/powershell/${PS_VERSION}/pwsh

          # Create/overwrite global symlink
          ln -sf /opt/microsoft/powershell/${PS_VERSION}/pwsh /usr/bin/pwsh

          # Quick sanity check
          pwsh -NoLogo -Command '$PSVersionTable'

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mark repo as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run PowerShell init script
        shell: pwsh
        run: ./init_solution.ps1

      - name: Native build 32
        run: make --directory "./${{ env.ARTIFACTS }}/${{ env.ARM32 }}"

      - name: Native build 64
        run: make --directory "./${{ env.ARTIFACTS }}/${{ env.ARM64 }}"

      # Upload native artifacts
      - name: Upload 32-bit artifact
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_ARM }}
          path: ./${{ env.ARTIFACTS }}/${{ env.ARM32 }}/${{ env.SOEM_WRAPPER }}/${{ env.FILE_BASE }}${{ env.FILE_EXT_LINUX }}

      - name: Upload 64-bit artifact
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_ARM64 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.ARM64 }}/${{ env.SOEM_WRAPPER }}/${{ env.FILE_BASE }}${{ env.FILE_EXT_LINUX }}

  build-windows:

    runs-on: windows-latest
    needs: [detect-branch, build-linux-x64, build-linux-arm]

    env:
      IS_MASTER_BRANCH: ${{ needs.detect-branch.outputs.is_master_branch }}

    defaults:
      run:
        shell: pwsh

    steps:

      - run: echo "Windows build on ${{ runner.arch }}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Run PowerShell init script
        run: |
          dotnet --info
          ./init_solution.ps1

      - name: Native build 32 (Windows)
        run: msbuild ./${{ env.ARTIFACTS }}/${{ env.BIN32 }}/${{ env.SOEM_WRAPPER }}/soem_wrapper.vcxproj /p:Configuration=$Env:CONFIGURATION

      - name: Native build 64 (Windows)
        run: msbuild ./${{ env.ARTIFACTS }}/${{ env.BIN64 }}/${{ env.SOEM_WRAPPER }}/soem_wrapper.vcxproj /p:Configuration=$Env:CONFIGURATION

      # Upload native artifacts
      - name: Upload 32-bit artifact
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.WIN_X86 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.BIN32 }}/${{ env.SOEM_WRAPPER }}/${{ env.CONFIGURATION }}/

      - name: Upload 64-bit artifact
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.WIN_X64 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.BIN64 }}/${{ env.SOEM_WRAPPER }}/${{ env.CONFIGURATION }}/

      # Download linux artifacts
      - name: Download Linux x86 libs
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_X86 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.DOWNLOAD }}/${{ env.LINUX_X86 }}

      - name: Download Linux x64 libs
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_X64 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.DOWNLOAD }}/${{ env.LINUX_X64 }}

      - name: Download ARM 32-bit libs
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_ARM }}
          path: ./${{ env.ARTIFACTS }}/${{ env.DOWNLOAD }}/${{ env.LINUX_ARM }}

      - name: Download ARM 64-bit libs
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FILE_BASE }}_${{ env.LINUX_ARM64 }}
          path: ./${{ env.ARTIFACTS }}/${{ env.DOWNLOAD }}/${{ env.LINUX_ARM64 }}

      # Build .NET project
      - name: .NET build
        shell: pwsh
        run: |
            $publicArg = '/p:IsPublicBuild=False'
            if ($Env:IS_MASTER_BRANCH -eq 'true') {
              $publicArg = '/p:IsPublicBuild=True'
            }

            dotnet build ./src/EtherCAT.NET/EtherCAT.NET.csproj -c $Env:CONFIGURATION $publicArg

      # Upload .NET nuget packages
      - name: Upload .NET nuget packages
        if: env.IS_MASTER_BRANCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget_packages
          path: ./${{ env.ARTIFACTS }}/${{ env.PACKAGES }}/

      # Push packages to nuget
      - name: Push packages to nuget.org
        if: env.IS_MASTER_BRANCH == 'true'
        run: >
          dotnet nuget push .\${{ env.ARTIFACTS }}\${{ env.PACKAGES }}\*.nupkg
          --api-key $Env:NUGET_API_KEY
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
